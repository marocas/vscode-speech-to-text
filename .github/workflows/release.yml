name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bump version and create git tag
        run: pnpm release

      - name: Push release commit and tags
        run: |
          git push origin HEAD:main
          git push origin --tags

      - name: Resolve release tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Build macOS DMG
        run: pnpm dist:mac

      - name: Resolve DMG path
        id: dmg
        run: |
          dmg_path=$(ls -1 release/*.dmg | head -n 1)
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists."
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi

      - name: Upload DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: gh release upload "$TAG" "$DMG_PATH" --clobber
